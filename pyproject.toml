[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "image2dng"
version = "0.1.0"
description = "Synthetic Image-to-DNG LinearRaw generator prototype."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary prototype" }
authors = [{ name = "image2dng contributors" }]
dependencies = [
  "imagecodecs>=2026.3.6",
  "numpy>=2.0",
  "pillow>=12.3.0",
  "pypng>=0.20220715.0",
  "tifffile>=2025.10.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
image2dng = "image2dng.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
